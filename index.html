<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CarageX | Multi Brand Car Service & Performance Garage Hyderabad</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg-dark: #0a0d14;
      --bg-card: #131926;
      --bg-card-hover: #1a2336;
      --accent: #ff3e3e;
      --accent-hover: #e02828;
      --gold: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #232e42;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
    }

    /* Top Strip */
    .top-strip {
      background: #05070a;
      border-bottom: 1px solid var(--border-color);
      padding: 8px 5%;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .top-strip a { color: var(--gold); text-decoration: none; font-weight: 600; }

    /* Navigation */
    header {
      background: rgba(10, 13, 20, 0.95);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--border-color);
    }
    .nav-container {
      max-width: 1200px;
      margin: auto;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }
    .brand-logo span { color: var(--accent); }
    .nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
      list-style: none;
    }
    .nav-links a {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 14px;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: #fff; }
    .btn-header {
      background: var(--accent);
      color: #fff !important;
      padding: 9px 18px;
      border-radius: 8px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* Hero Section */
    .hero {
      position: relative;
      background: linear-gradient(180deg, rgba(10, 13, 20, 0.8) 0%, rgba(10, 13, 20, 0.98) 100%),
                  url('https://images.unsplash.com/photo-1613214149922-f1809c99b414?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
      padding: 110px 20px 80px;
      text-align: center;
    }
    .hero-badge {
      display: inline-block;
      background: rgba(255, 62, 62, 0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .hero h1 {
      font-size: clamp(34px, 5.5vw, 56px);
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 18px;
      color: #fff;
    }
    .hero h1 span {
      background: linear-gradient(90deg, #ff3e3e, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p {
      max-width: 720px;
      margin: 0 auto 32px;
      font-size: 17px;
      color: var(--text-muted);
    }
    .hero-btns {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .btn-main {
      background: var(--accent);
      color: #fff;
      padding: 14px 28px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn-main:hover { background: var(--accent-hover); }
    .btn-outline {
      background: transparent;
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 14px 28px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: border-color 0.2s;
    }
    .btn-outline:hover { border-color: var(--accent); }

    /* Stats Grid */
    .stats-bar {
      max-width: 1100px;
      margin: -35px auto 60px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 18px;
      position: relative;
    }
    .stat-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: var(--radius);
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .stat-number {
      font-size: 32px;
      font-weight: 900;
      color: var(--gold);
      margin-bottom: 4px;
    }
    .stat-label {
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Section Global */
    .section {
      max-width: 1200px;
      margin: 80px auto;
      padding: 0 20px;
    }
    .section-head {
      text-align: center;
      margin-bottom: 48px;
    }
    .section-head h2 {
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #fff;
    }
    .section-head p { color: var(--text-muted); font-size: 16px; }

    /* Service Cards */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }
    .service-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .service-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      background: var(--bg-card-hover);
    }
    .service-photo {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      border-bottom: 1px solid var(--border-color);
    }
    .service-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .service-body h3 {
      font-size: 20px;
      color: #fff;
      margin-bottom: 10px;
    }
    .service-body p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 18px;
      flex-grow: 1;
    }
    .service-tag {
      font-size: 12px;
      color: var(--gold);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Horizontal Scrolling Google Reviews Section */
    .reviews-section {
      position: relative;
    }
    .reviews-carousel-wrapper {
      position: relative;
      width: 100%;
      margin-top: 20px;
    }
    .reviews-carousel {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      padding: 10px 4px 25px;
      -webkit-overflow-scrolling: touch;
    }
    .reviews-carousel::-webkit-scrollbar {
      height: 6px;
    }
    .reviews-carousel::-webkit-scrollbar-track {
      background: #090c13;
      border-radius: 4px;
    }
    .reviews-carousel::-webkit-scrollbar-thumb {
      background: #232e42;
      border-radius: 4px;
    }
    .reviews-carousel::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }
    .review-card-h {
      flex: 0 0 380px;
      max-width: 380px;
      scroll-snap-align: start;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .review-card-h:hover {
      border-color: #3b82f6;
      transform: translateY(-4px);
    }
    .review-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .reviewer-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
